<span
  class="inline-flex items-center gap-1.5 font-mono rounded border transition-all duration-200"
  [class.px-2.5]="size() === 'md'"
  [class.py-1]="size() === 'md'"
  [class.text-xs]="size() === 'md'"
  [class.px-2]="size() === 'sm'"
  [class.py-0.5]="size() === 'sm'"
  [class.text-[11px]]="size() === 'sm'"
  [class.bg-cyan-950/40]="variant() === 'cyan' || highlight()"
  [class.text-cyan-300]="variant() === 'cyan' || highlight()"
  [class.border-cyan-500/30]="variant() === 'cyan' || highlight()"
  [class.hover:border-cyan-400/60]="variant() === 'cyan' || highlight()"
  [class.shadow-[0_0_10px_rgba(6,182,212,0.15)]]="highlight()"
  [class.bg-slate-900/80]="variant() === 'slate' && !highlight()"
  [class.text-slate-300]="variant() === 'slate' && !highlight()"
  [class.border-slate-700/60]="variant() === 'slate' && !highlight()"
  [class.hover:border-slate-500]="variant() === 'slate' && !highlight()"
  [class.bg-emerald-950/40]="variant() === 'emerald' && !highlight()"
  [class.text-emerald-300]="variant() === 'emerald' && !highlight()"
  [class.border-emerald-500/30]="variant() === 'emerald' && !highlight()"
>
  @if (highlight()) {
    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
  } @else {
    <span class="text-slate-500 font-mono text-[10px]">#</span>
  }
  <span>{{ name() }}</span>
</span>
