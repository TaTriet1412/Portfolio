<header class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md bg-slate-950/85 border-b border-slate-800/80 transition-all">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-6xl">
    <div class="flex items-center justify-between h-16 sm:h-20">
      
      <!-- Brand Logo / Terminal Metaphor -->
      <a
        href="#home"
        (click)="setActive('home')"
        class="group flex items-center gap-2 font-mono text-sm sm:text-base font-bold text-slate-100 hover:text-cyan-300 transition-colors"
      >
        <span class="text-cyan-400">&gt;</span>
        <span>triet&#64;backend</span>
        <span class="text-slate-500">:</span>
        <span class="text-cyan-400">~</span>
        <span class="text-slate-400">$</span>
        <span class="inline-block w-2 h-4 bg-cyan-400 animate-pulse ml-0.5"></span>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center gap-5 lg:gap-6">
        @for (item of navItems; track item.id) {
          <a
            [href]="'#' + item.id"
            (click)="setActive(item.id)"
            class="group font-mono text-xs lg:text-[13px] py-1 transition-all duration-200 flex items-center gap-1.5"
            [class.text-cyan-400]="activeSection() === item.id"
            [class.font-semibold]="activeSection() === item.id"
            [class.text-slate-400]="activeSection() !== item.id"
            [class.hover:text-slate-200]="activeSection() !== item.id"
          >
            <span class="text-cyan-500/80 group-hover:text-cyan-400">{{ item.num }}.</span>
            <span>{{ item.label }}</span>
          </a>
        }

        <!-- Actions Divider -->
        <div class="h-4 w-px bg-slate-800"></div>

        <!-- Language Switcher Button (VIE / ENG) -->
        <button
          type="button"
          (click)="toggleLanguage()"
          [title]="currentLang() === 'vi' ? 'Switch to English' : 'Chuyển sang Tiếng Việt'"
          class="flex items-center gap-1 font-mono text-xs px-2.5 py-1.5 rounded-lg border border-slate-700/80 bg-slate-900/80 hover:border-cyan-500/50 hover:bg-slate-850 text-slate-300 transition-all cursor-pointer shadow-sm"
        >
          <span class="text-[11px]" [class.text-cyan-400]="currentLang() === 'vi'" [class.font-bold]="currentLang() === 'vi'" [class.opacity-50]="currentLang() !== 'vi'">VIE</span>
          <span class="text-slate-600 text-[10px]">/</span>
          <span class="text-[11px]" [class.text-cyan-400]="currentLang() === 'en'" [class.font-bold]="currentLang() === 'en'" [class.opacity-50]="currentLang() !== 'en'">ENG</span>
        </button>

        <!-- Theme Switcher Button (Dark / Light) -->
        <button
          type="button"
          (click)="toggleTheme()"
          [title]="isDark() ? 'Chuyển sang Light Mode' : 'Chuyển sang Dark Mode (Gốc)'"
          class="p-2 rounded-lg border border-slate-700/80 bg-slate-900/80 text-slate-300 hover:text-cyan-400 hover:border-cyan-500/50 hover:bg-slate-850 transition-all cursor-pointer shadow-sm"
        >
          @if (isDark()) {
            <!-- Sun icon when dark to switch to light -->
            <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          } @else {
            <!-- Moon icon when light to switch to dark -->
            <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          }
        </button>

        <!-- CTA Contact Quick Action -->
        <a
          href="#contact"
          (click)="setActive('contact')"
          class="font-mono text-xs font-semibold px-3.5 py-1.5 rounded-lg bg-cyan-950/80 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-500 hover:text-slate-950 hover:shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all duration-200"
        >
          {{ uiText().nav.contactBtn }}
        </a>
      </nav>

      <!-- Mobile Right Controls (Lang, Theme & Menu Burger) -->
      <div class="flex md:hidden items-center gap-2">
        <!-- Mobile Language Switcher -->
        <button
          type="button"
          (click)="toggleLanguage()"
          class="font-mono text-[11px] px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer"
        >
          {{ currentLang() === 'vi' ? 'VIE' : 'ENG' }}
        </button>

        <!-- Mobile Theme Switcher -->
        <button
          type="button"
          (click)="toggleTheme()"
          class="p-1.5 rounded border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer"
        >
          @if (isDark()) {
            <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
            </svg>
          } @else {
            <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          }
        </button>

        <!-- Burger Toggle -->
        <button
          type="button"
          (click)="toggleMenu()"
          aria-label="Toggle menu"
          class="p-1.5 rounded border border-slate-800 bg-slate-900 text-slate-300 hover:text-cyan-400 cursor-pointer"
        >
          <svg class="w-5 h-5 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2">
            @if (!mobileMenuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            }
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  @if (mobileMenuOpen()) {
    <div class="md:hidden bg-slate-950 border-b border-slate-800 px-4 pt-2 pb-6 space-y-2 font-mono text-sm">
      @for (item of navItems; track item.id) {
        <a
          [href]="'#' + item.id"
          (click)="setActive(item.id)"
          class="block py-2 px-3 rounded-lg transition-colors flex items-center justify-between"
          [class.bg-slate-900]="activeSection() === item.id"
          [class.text-cyan-400]="activeSection() === item.id"
          [class.text-slate-300]="activeSection() !== item.id"
        >
          <span>// {{ item.label }}</span>
          <span class="text-xs text-slate-500">{{ item.num }}</span>
        </a>
      }
      <div class="pt-2">
        <a
          href="#contact"
          (click)="setActive('contact')"
          class="block text-center py-2.5 rounded-lg bg-cyan-500 text-slate-950 font-bold"
        >
          {{ uiText().nav.contactBtn }}
        </a>
      </div>
    </div>
  }
</header>
