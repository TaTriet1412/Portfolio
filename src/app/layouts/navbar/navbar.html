<header
  class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md bg-slate-950/85 border-b border-slate-800/80 transition-all">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-6xl">
    <div class="flex items-center justify-between h-16 sm:h-20">

      <!-- Brand Logo / Terminal Metaphor -->
      <a href="#home" (click)="setActive('home')"
        class="group flex items-center gap-2 font-mono text-sm sm:text-base font-bold text-slate-100 hover:text-cyan-300 transition-colors">
        <span class="text-cyan-400">&gt;</span>
        <span>triet&#64;backend</span>
        <span class="text-slate-500">:</span>
        <span class="text-cyan-400">~</span>
        <span class="text-slate-400">$</span>
        <span class="inline-block w-2 h-4 bg-cyan-400 animate-pulse ml-0.5"></span>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center gap-5 lg:gap-6">
        @for (item of navItems; track item.id) {
        <a [href]="'#' + item.id" (click)="setActive(item.id)"
          class="group font-mono text-xs lg:text-[13px] py-1 transition-all duration-200"
          [class.text-cyan-400]="activeSection() === item.id" [class.font-semibold]="activeSection() === item.id"
          [class.text-slate-400]="activeSection() !== item.id"
          [class.hover:text-slate-200]="activeSection() !== item.id">
          {{ item.label }}
        </a>
        }

        <!-- Actions Divider -->
        <div class="h-4 w-px bg-slate-800"></div>

        <!-- Language Switcher Button (VIE / ENG) -->
        <button type="button" (click)="toggleLanguage()"
          [title]="currentLang() === 'vi' ? 'Switch to English' : 'Chuyển sang Tiếng Việt'"
          class="flex items-center gap-1 font-mono text-xs px-2.5 py-1.5 rounded-lg border border-slate-700/80 bg-slate-900/80 hover:border-cyan-500/50 hover:bg-slate-850 text-slate-300 transition-all cursor-pointer shadow-sm">
          <span class="text-[11px]" [class.text-cyan-400]="currentLang() === 'vi'"
            [class.font-bold]="currentLang() === 'vi'" [class.opacity-50]="currentLang() !== 'vi'">VIE</span>
          <span class="text-slate-600 text-[10px]">/</span>
          <span class="text-[11px]" [class.text-cyan-400]="currentLang() === 'en'"
            [class.font-bold]="currentLang() === 'en'" [class.opacity-50]="currentLang() !== 'en'">ENG</span>
        </button>
      </nav>

      <!-- Mobile Right Controls (Lang & Menu Burger) -->
      <div class="flex md:hidden items-center gap-2">
        <!-- Mobile Language Switcher -->
        <button type="button" (click)="toggleLanguage()"
          class="font-mono text-[11px] px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer">
          {{ currentLang() === 'vi' ? 'VIE' : 'ENG' }}
        </button>

        <!-- Burger Toggle -->
        <button type="button" (click)="toggleMenu()" aria-label="Toggle menu"
          class="p-1.5 rounded border border-slate-800 bg-slate-900 text-slate-300 hover:text-cyan-400 cursor-pointer">
          <svg class="w-5 h-5 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2">
            @if (!mobileMenuOpen()) {
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            } @else {
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            }
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  @if (mobileMenuOpen()) {
  <div class="md:hidden bg-slate-950 border-b border-slate-800 px-4 pt-2 pb-6 space-y-2 font-mono text-sm">
    @for (item of navItems; track item.id) {
    <a [href]="'#' + item.id" (click)="setActive(item.id)" class="block py-2 px-3 rounded-lg transition-colors"
      [class.bg-slate-900]="activeSection() === item.id" [class.text-cyan-400]="activeSection() === item.id"
      [class.text-slate-300]="activeSection() !== item.id">
      // {{ item.label }}
    </a>
    }
  </div>
  }
</header>
